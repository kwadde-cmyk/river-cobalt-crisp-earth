name: startos-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wrapper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/startos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/startos/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test src/lib/miniscript/miniscript.test.ts
