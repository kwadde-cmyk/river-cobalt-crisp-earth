# Optional: Scriptwerk hinter vorhandenem Nginx (Debian/Raspi).
#   sudo cp deploy/nginx-scriptwerk.conf /etc/nginx/sites-available/scriptwerk
#   Port unten an SCRIPTWERK_PORT anpassen, dann:
#   sudo ln -s /etc/nginx/sites-available/scriptwerk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name scriptwerk.local;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
